<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <title>Match Activity Calendar</title>
  <style>
    :root {
      --bg: #10171B;
      --card: #10171B;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --header-accent: #0DF699;
      --month-line: #0DF699;
      --calendar-bg: #171A21;
      --c0: #161E22;
      --c1: #0F4E3A;
      --c2: #0E8F5F;
      --c3: #0E8F5F;
      --c5: #0DF397;
    }

    /* GitHub palette */
    body.github-theme {
      --header-accent: #1F6FEB;
      --month-line: #1F6FEB;
      --calendar-bg: #0D1117;
      --c0: #151B23;
      --c1: #033A16;
      --c2: #196C2E;
      --c3: #2EA043;
      --c5: #2EA043;
    }

    /* Leetify palette */
    body.leetify-theme {
      --header-accent: #F84982;
      --month-line: #F84982;
      --calendar-bg: #201E25;
      --c0: #2A2631;
      --c1: #40305F;
      --c2: #5D3D8A;
      --c3: #987AC6;
      --c5: #D5C8E9;
    }

    /* Windows XP Explorer palette */
    body.xp-theme {
      --header-accent: #99B4D1;
      --month-line: #0078D7;
      --calendar-bg: #000000;
      --c0: #1C1C1C;
      --c1: #8A8A8A;
      --c2: #C8C8C8;
      --c3: #E3E3E3;
      --c5: #D7E4F2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Shared control styling keeps buttons and checkbox toggles visually consistent. */
    .theme-toggle,
    .numbers-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 7px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .theme-toggle:hover,
    .numbers-control:hover { border-color: var(--header-accent); }
    .theme-toggle:focus-visible,
    .numbers-control:focus-within { outline: 2px solid var(--header-accent); outline-offset: 2px; }
    .account-toggle[hidden],
    .numbers-control[hidden] { display: none !important; }
    .theme-toggle.active,
    .numbers-control.active { background: var(--header-accent); border-color: var(--header-accent); color: #10171B; }
    .numbers-control input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .card {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      /* Resize the entire outer box, including upload area, controls and calendar. */
      resize: both;
      overflow: auto;
      width: 100%;
      max-width: none;
      min-width: 420px;
      min-height: 260px;
    }

    /* Once data is loaded, let the themed calendar fill the card edge-to-edge. */
    .card.loaded {
      display: block;
      padding: 0;
      /* Keep the entire resizable outer box filled with the active theme background. */
      background: var(--calendar-bg);
      border-color: var(--calendar-bg);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .total {
      font-size: 1.1rem;
    }

    .total span {
      font-weight: 700;
      color: var(--header-accent);
    }

    /* File loader */
    .file-zone {
      border: 2px dashed #30363d;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      margin: 0 0 20px;
      cursor: pointer;
      transition: 0.2s;
      color: var(--muted);
    }
    .file-zone:hover, .file-zone.dragover {
      border-color: #0E8F5F;
      background: rgba(14, 143, 95, 0.08);
      color: #fff;
    }
    .file-zone input {
      display: none;
    }

    .calendar-panel {
      background: var(--calendar-bg);
      border-radius: 0 0 11px 11px;
      padding: 20px;
      /* Full-bleed theme background, edge-to-edge inside the outer card border */
      margin: 0 -20px -20px;
    }

    .card.loaded .calendar-panel {
      margin: 0;
      border-radius: 11px;
    }

    /* The calendar panel follows the size of the outer card; it is not independently resizable. */
    .calendar-panel {
      width: 100%;
      min-width: 0;
    }

    .year-section { margin-bottom: 28px; }
    .year-heading { font-size: 1.15rem; color: var(--header-accent); margin: 8px 0 10px 38px; }
    .year-section:last-child { margin-bottom: 0; }

    /* Month view: 12 month rows, with days running horizontally across each row. */
    .month-matrix-wrap { overflow-x: auto; padding: 2px 2px 8px; }
    .month-matrix { display: grid; grid-template-columns: 42px repeat(31, 18px); gap: 4px; min-width: max-content; }
    .month-row { display: contents; }
    .month-column-title { grid-column: 1; font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; white-space: nowrap; }
    .month-matrix .cell { width: 18px; height: 18px; min-width: 0; border-radius: 3px; }
    .month-matrix .cell.invalid-day { visibility: hidden; }

    .calendar-area {
      background: transparent;
      padding: 0;
      overflow-x: auto;
    }

    .calendar-wrapper {
      display: flex;
      gap: 10px;
    }

    .days-label {
      display: grid;
      grid-template-rows: repeat(7, 15px);
      row-gap: 3px;
      align-content: start;
      font-size: 0.7rem;
      color: var(--muted);
      width: 28px;
      flex-shrink: 0;
    }

    .days-label span {
      height: 15px;
      line-height: 15px;
    }

    .months-row {
      display: flex;
      margin-left: 38px;
      margin-bottom: 6px;
      height: 20px;
      position: relative;
    }

    .month-label {
      position: absolute;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 15px);
      gap: 3px;
      position: relative;
    }

    .month-divider {
      position: absolute;
      width: 1px;
      background: var(--month-line);
      pointer-events: none;
      z-index: 2;
      opacity: 0.9;
    }

    /* Mark only the first day of each month, tightly around the cell. */
    .cell.month-start {
      outline: 1px solid var(--month-line);
      outline-offset: 0;
    }

    body.hide-month-markers .month-divider { display: none; }
    body.hide-month-markers .cell.month-start { outline-color: transparent; }

    .cell {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: var(--c0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      color: #000;
      cursor: default;
      transition: transform 0.12s;
    }

    .cell:hover {
      transform: scale(1.3);
      z-index: 5;
      outline: 1px solid #fff;
    }

    .cell.level-0 { background: var(--c0); color: #fff; }
    .cell.level-1 { background: var(--c1); color: #fff; }
    .cell.level-2 { background: var(--c2); color: #fff; }
    .cell.level-3 { background: var(--c3); color: #fff; }
    .cell.level-5 { background: var(--c5); color: #000; }

    body.github-theme .cell,
    body.leetify-theme .cell,
    body.xp-theme .cell { border-radius: 3px; }

    /* Dark text keeps the lighter Windows XP levels readable when numbers are enabled. */
    body.xp-theme .cell.level-1,
    body.xp-theme .cell.level-2,
    body.xp-theme .cell.level-3,
    body.xp-theme .cell.level-5 { color: #111; }

    body.hide-numbers .cell { color: transparent !important; }

    .tooltip {
      position: fixed;
      background: #1f2937;
      color: white;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.35;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 100;
      white-space: nowrap;
      border: 1px solid #374151;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      transform: translate(-50%, calc(-100% - 10px));
    }
    .tooltip-date { font-weight: 700; }
    .tooltip-total { margin-top: 2px; }
    .tooltip-separator {
      height: 1px;
      background: #64748b;
      margin: 5px 0 4px;
      opacity: .9;
    }
    .tooltip-breakdown { display: flex; flex-direction: column; align-items: center; }

    @media (max-width: 800px) {
      .cell { width: 12px; height: 12px; font-size: 8px; }
      .grid { gap: 2px; }
      .days-label {
        grid-template-rows: repeat(7, 12px);
        row-gap: 2px;
      }
      .days-label span {
        height: 12px;
        line-height: 12px;
      }
    }
  </style>
</head>
<body class="hide-numbers hide-month-markers">
  <div class="container">
    <h1>Match Activity History</h1>
    <p class="subtitle">Just like on CSRep.gg History Visualizer for no apparent reason <3 </p>

    <!-- Upload stays outside the resizable calendar box and is visible before a file is loaded. -->
    <div class="file-zone" id="fileZone">
      <div>Click here or drag & drop <strong>TXT, CSV, TSV, or XLSX file</strong></div>
      <input type="file" id="fileInput" accept=".txt,.csv,.tsv,.xlsx,text/plain,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>

    <div class="card" id="calendarCard">
      <div class="calendar-panel">
        <div class="header">
          <div class="total">Total matches: <span id="totalMatches">0</span></div>
          <div class="header-actions">
            <button type="button" class="theme-toggle" id="themeToggle" title="Cycle through CSRep, GitHub, Leetify, and Windows XP themes">Theme: CSRep</button>
            <button type="button" id="secondAccountToggle" class="theme-toggle account-toggle" hidden aria-pressed="false" title="Toggle second-account matches">2nd account: Off</button>
            <label class="numbers-control" aria-pressed="false"><input type="checkbox" id="numbersToggle"> Show numbers</label>
            <label class="numbers-control" aria-pressed="false"><input type="checkbox" id="monthMarkersToggle"> Show month markers</label>
            <label class="numbers-control" aria-pressed="false"><input type="checkbox" id="separateYearsToggle"> Years view</label>
            <label class="numbers-control" aria-pressed="false"><input type="checkbox" id="monthlyViewToggle"> Month view</label>
          </div>
        </div>

        <div class="calendar-area">
        <div class="months-row" id="monthsRow"></div>

        <div class="calendar-wrapper">
          <div class="days-label">
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
            <span>Sun</span>
          </div>
          <div id="grid" class="grid"></div>
        </div>
        </div>
      </div>
    </div>

  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const fileZone = document.getElementById('fileZone');
    const fileInput = document.getElementById('fileInput');
    const themeToggle = document.getElementById('themeToggle');
    const monthMarkersToggle = document.getElementById('monthMarkersToggle');
    const separateYearsToggle = document.getElementById('separateYearsToggle');
    const monthlyViewToggle = document.getElementById('monthlyViewToggle');

    const themeNames = ['CSRep', 'GitHub', 'Leetify', 'Windows XP'];
    let currentTheme = 0;
    let loadedData = null;
    let primaryData = null;
    let secondAccountData = {};
    let secondAccountIncluded = false;
    const secondAccountToggle = document.getElementById('secondAccountToggle');

    secondAccountToggle.addEventListener('click', () => {
      if (!primaryData || !Object.keys(secondAccountData).length) return;
      secondAccountIncluded = !secondAccountIncluded;
      loadedData = combineAccountData();
      secondAccountToggle.textContent = secondAccountIncluded ? '2nd account: On' : '2nd account: Off';
      secondAccountToggle.classList.toggle('active', secondAccountIncluded);
      secondAccountToggle.setAttribute('aria-pressed', String(secondAccountIncluded));
      renderCalendar(loadedData);
    });

    function combineAccountData() {
      const combined = { ...(primaryData || {}) };
      if (secondAccountIncluded) {
        Object.entries(secondAccountData).forEach(([date, count]) => {
          combined[date] = (combined[date] || 0) + count;
        });
      }
      return combined;
    }

    themeToggle.addEventListener('click', () => {
      currentTheme = (currentTheme + 1) % themeNames.length;
      document.body.classList.remove('github-theme', 'leetify-theme', 'xp-theme');
      if (themeNames[currentTheme] === 'GitHub') document.body.classList.add('github-theme');
      if (themeNames[currentTheme] === 'Leetify') document.body.classList.add('leetify-theme');
      if (themeNames[currentTheme] === 'Windows XP') document.body.classList.add('xp-theme');
      themeToggle.textContent = `Theme: ${themeNames[currentTheme]}`;
      themeToggle.setAttribute('aria-label', `Current theme: ${themeNames[currentTheme]}. Click to switch theme.`);
      if (loadedData) renderCalendar(loadedData);
    });

    const numbersToggle = document.getElementById('numbersToggle');
    function syncToggleStyle(input) {
      input.closest('.numbers-control').classList.toggle('active', input.checked);
      input.closest('.numbers-control').setAttribute('aria-pressed', String(input.checked));
    }

    function syncMonthMarkersVisibility() {
      monthMarkersToggle.closest('.numbers-control').hidden = monthlyViewToggle.checked;
    }

    numbersToggle.addEventListener('change', () => {
      document.body.classList.toggle('hide-numbers', !numbersToggle.checked);
      syncToggleStyle(numbersToggle);
      if (loadedData) renderCalendar(loadedData);
    });

    monthMarkersToggle.addEventListener('change', () => {
      document.body.classList.toggle('hide-month-markers', !monthMarkersToggle.checked);
      syncToggleStyle(monthMarkersToggle);
    });

    separateYearsToggle.addEventListener('change', () => {
      if (separateYearsToggle.checked) monthlyViewToggle.checked = false;
      syncToggleStyle(separateYearsToggle);
      syncToggleStyle(monthlyViewToggle);
      syncMonthMarkersVisibility();
      if (loadedData) renderCalendar(loadedData);
    });

    monthlyViewToggle.addEventListener('change', () => {
      if (monthlyViewToggle.checked) separateYearsToggle.checked = false;
      syncToggleStyle(monthlyViewToggle);
      syncToggleStyle(separateYearsToggle);
      syncMonthMarkersVisibility();
      if (loadedData) renderCalendar(loadedData);
    });

    syncMonthMarkersVisibility();

    fileZone.addEventListener('click', () => fileInput.click());

    fileZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileZone.classList.add('dragover');
    });
    fileZone.addEventListener('dragleave', () => {
      fileZone.classList.remove('dragover');
    });
    fileZone.addEventListener('drop', (e) => {
      e.preventDefault();
      fileZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      const isXlsx = /\.xlsx$/i.test(file.name);
      const processText = (text) => {
        const data = {};
        const secondData = {};

        text.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (!line || line.startsWith('//') || line.startsWith('const')) return;

          // Keep supporting the original TXT/JSON-like format: "YYYY-MM-DD": count
          const originalMatch = line.match(/"?(\d{4}-\d{2}-\d{2})"?\s*:\s*(\d+)/);
          if (originalMatch) {
            data[originalMatch[1]] = parseInt(originalMatch[2], 10);
            return;
          }

          const delimiter = /\.tsv$/i.test(file.name) || line.includes('\t') ? '\t' : ',';
          const fields = line.split(delimiter).map(field => field.trim().replace(/^"|"$/g, ''));
          let dateIndex = fields.findIndex(field => /^\d{4}-\d{2}-\d{2}$/.test(field));
          // Accept common spreadsheet date display formats as well as ISO dates.
          if (dateIndex < 0) {
            dateIndex = fields.findIndex(field => /^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/.test(field));
            if (dateIndex >= 0) {
              const m = fields[dateIndex].match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
              let year = Number(m[3]);
              if (year < 100) year += year >= 70 ? 1900 : 2000;
              // Interpret spreadsheet-style dates as month/day/year.
              fields[dateIndex] = `${year}-${String(Number(m[1])).padStart(2,'0')}-${String(Number(m[2])).padStart(2,'0')}`;
            }
          }
          if (dateIndex < 0) return;

          const date = fields[dateIndex];
          const mainField = fields[dateIndex + 1] ?? '';
          const secondField = fields[dateIndex + 2] ?? '';
          if (/^\d+$/.test(mainField)) {
            data[date] = parseInt(mainField, 10);
            if (fields.length > dateIndex + 2 && /^\d+$/.test(secondField)) {
              secondData[date] = parseInt(secondField, 10);
            }
          } else {
            for (let i = dateIndex - 1; i >= 0; i--) {
              if (/^\d+$/.test(fields[i])) { data[date] = parseInt(fields[i], 10); break; }
            }
          }
        });

        if (!Object.keys(data).length) {
          alert('No date and match-count data found. Use YYYY-MM-DD dates and a numeric main-account column in TXT, CSV, TSV, or XLSX format.');
          return;
        }

        primaryData = data;
        secondAccountData = secondData;
        secondAccountIncluded = false;
        loadedData = combineAccountData();
        const hasSecondAccountMatches = Object.values(secondAccountData).some(count => count > 0);
        secondAccountToggle.hidden = !hasSecondAccountMatches;
        secondAccountToggle.textContent = '2nd account: Off';
        secondAccountToggle.classList.remove('active');
        secondAccountToggle.setAttribute('aria-pressed', 'false');
        renderCalendar(loadedData);
        fileZone.style.display = 'none';
        document.getElementById('calendarCard').classList.add('loaded');
      };

      if (isXlsx) {
        if (typeof XLSX === 'undefined') {
          alert('XLSX support needs an internet connection to load the spreadsheet reader. Please reconnect and reopen this page.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const workbook = XLSX.read(e.target.result, { type: 'array', cellDates: true });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd', defval: '' });
            const text = rows.map(row => row.map(value => {
              if (value instanceof Date && !isNaN(value)) {
                return `${value.getFullYear()}-${String(value.getMonth()+1).padStart(2,'0')}-${String(value.getDate()).padStart(2,'0')}`;
              }
              return String(value ?? '');
            }).join('\t')).join('\n');
            processText(text);
          } catch (err) {
            alert('Could not read this XLSX file. Please try exporting the sheet as CSV or TSV.');
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e) => processText(e.target.result);
        reader.readAsText(file);
      }
    }

    function getLevel(count) {
      if (count === 0) return 0;
      if (count === 1) return 1;

      // Leetify: 0, 1, 2–3, 4–5, 6+
      if (themeNames[currentTheme] === 'Leetify') {
        if (count <= 3) return 2;
        if (count <= 5) return 3;
        return 5;
      }

      // GitHub and Windows XP: 0, 1, 2, 3, 4+
      if (themeNames[currentTheme] === 'GitHub' || themeNames[currentTheme] === 'Windows XP') {
        if (count === 2) return 2;
        if (count === 3) return 3;
        return 5;
      }

      // CSRep original: 0, 1, 2–4, 5+
      if (count <= 4) return 2;
      return 5;
    }

    function showMatchTooltip(tooltip, event, date, count) {
      const parsed = new Date(date + 'T12:00:00');
      const dateLabel = Number.isNaN(parsed.getTime())
        ? date
        : parsed.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      tooltip.innerHTML = '';
      const dateLine = document.createElement('div');
      dateLine.className = 'tooltip-date';
      dateLine.textContent = dateLabel;
      const totalLine = document.createElement('div');
      totalLine.className = 'tooltip-total';
      totalLine.textContent = `${count} match${count !== 1 ? 'es' : ''}`;
      tooltip.append(dateLine, totalLine);
      tooltip.style.left = `${event.clientX}px`;
      tooltip.style.top = `${event.clientY}px`;
      tooltip.style.opacity = '1';
    }

    function renderMonthlyView(data, mainArea) {
      mainArea.innerHTML = '';
      const dates = Object.keys(data).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
      if (!dates.length) return;
      const years = [...new Set(dates.map(d => Number(d.slice(0, 4))))].sort((a, b) => a - b);
      const tooltip = document.getElementById('tooltip');
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      years.forEach(year => {
        const section = document.createElement('section');
        section.className = 'year-section month-matrix-section';
        const heading = document.createElement('h2');
        heading.className = 'year-heading';
        heading.textContent = String(year);
        section.appendChild(heading);

        const wrap = document.createElement('div');
        wrap.className = 'month-matrix-wrap';
        const matrix = document.createElement('div');
        matrix.className = 'month-matrix';

        for (let month = 0; month < 12; month++) {
          const title = document.createElement('div');
          title.className = 'month-column-title';
          title.textContent = monthNames[month];
          matrix.appendChild(title);

          const daysInMonth = new Date(year, month + 1, 0).getDate();
          for (let day = 1; day <= 31; day++) {
            const cell = document.createElement('div');
            if (day > daysInMonth) {
              cell.className = 'cell invalid-day';
              cell.setAttribute('aria-hidden', 'true');
            } else {
              const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              const count = data[date] || 0;
              cell.className = `cell level-${getLevel(count)}`;
              if (!document.body.classList.contains('hide-numbers') && count > 0) {
                const number = document.createElement('span');
                number.textContent = count;
                cell.appendChild(number);
              }
              cell.addEventListener('mouseenter', e => {
                showMatchTooltip(tooltip, e, date, count);
              });
              cell.addEventListener('mousemove', e => {
                showMatchTooltip(tooltip, e, date, count);
              });
              cell.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
            }
            matrix.appendChild(cell);
          }
        }
        wrap.appendChild(matrix);
        section.appendChild(wrap);
        mainArea.appendChild(section);
      });
      document.getElementById('totalMatches').textContent = Object.values(data).reduce((sum, count) => sum + count, 0);
    }

    function renderCalendar(data, targetArea = null) {
      const mainArea = document.querySelector('#calendarCard .calendar-area');
      if (!targetArea && monthlyViewToggle.checked) {
        renderMonthlyView(data, mainArea);
        document.getElementById("totalMatches").textContent = Object.values(data).reduce((sum, count) => sum + count, 0);
        return;
      }
      if (!targetArea && separateYearsToggle.checked) {
        const years = [...new Set(Object.keys(data).map(d => d.slice(0, 4)))].sort();
        mainArea.innerHTML = '';
        years.forEach(year => {
          const yearData = Object.fromEntries(Object.entries(data).filter(([date]) => date.startsWith(year + '-')));
          const section = document.createElement('section');
          section.className = 'year-section';
          const heading = document.createElement('h2');
          heading.className = 'year-heading';
          heading.textContent = year;
          const area = document.createElement('div');
          area.className = 'calendar-area';
          area.innerHTML = '<div class="months-row"></div><div class="calendar-wrapper"><div class="days-label"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="grid"></div></div>';
          section.append(heading, area);
          mainArea.appendChild(section);
          renderCalendar(yearData, area);
        });
        document.getElementById('totalMatches').textContent = Object.values(data).reduce((sum, count) => sum + count, 0);
        return;
      }
      if (!targetArea) {
        mainArea.innerHTML = '<div class="months-row" id="monthsRow"></div><div class="calendar-wrapper"><div class="days-label"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="grid" class="grid"></div></div>';
      }
      const root = targetArea || mainArea;
      const grid = root.querySelector('.grid');
      const monthsRow = root.querySelector('.months-row');
      const tooltip = document.getElementById("tooltip");

      grid.innerHTML = "";
      monthsRow.innerHTML = "";

      const dates = Object.keys(data).map(d => new Date(d + "T12:00:00"));
      if (dates.length === 0) return;

      const minDate = new Date(Math.min(...dates));
      const maxDate = new Date(Math.max(...dates));
      const isSplitYearCalendar = Boolean(targetArea && separateYearsToggle.checked);

      let start;
      let end;
      if (isSplitYearCalendar) {
        // In split mode, show only dates belonging to this calendar year.
        // Blank cells preserve weekday alignment without duplicating dates
        // from the previous or following year.
        const year = minDate.getFullYear();
        start = new Date(year, 0, 1, 12);
        end = new Date(year, 11, 31, 12);
      } else {
        start = new Date(minDate);
        start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
        end = new Date(maxDate);
        end.setDate(end.getDate() + (7 - end.getDay()) % 7);
      }

      let current = new Date(start);
      let weekIndex = 0;
      if (isSplitYearCalendar) {
        const leadingBlanks = (start.getDay() + 6) % 7;
        for (let i = 0; i < leadingBlanks; i++) {
          const blank = document.createElement('div');
          blank.className = 'cell empty-cell';
          grid.appendChild(blank);
        }
      }
      let total = 0;
      const monthStarts = [];
      let lastMonth = -1;
      let lastYear = -1;

      while (current <= end) {
        const dateStr = current.toISOString().slice(0, 10);
        const count = data[dateStr] || 0;
        total += count;

        const m = current.getMonth();
        const y = current.getFullYear();

        if (m !== lastMonth || y !== lastYear) {
          if (current.getDate() <= 7) {
            monthStarts.push({
              weekIndex: weekIndex,
              label: isSplitYearCalendar
                ? current.toLocaleString("default", { month: "long" })
                : current.toLocaleString("default", { month: "short", year: "2-digit" })
            });
          }
          lastMonth = m;
          lastYear = y;
        }
        const cell = document.createElement("div");
        cell.className = `cell level-${getLevel(count)}`;
        if (current.getDate() === 1) {
          cell.classList.add("month-start");

        }
        if (count >= 1) {
          const number = document.createElement("span");
          number.textContent = count;
          cell.appendChild(number);
        }

        cell.addEventListener("mouseenter", (e) => {
          showMatchTooltip(tooltip, e, dateStr, count);
        });
        cell.addEventListener("mousemove", (e) => {
          showMatchTooltip(tooltip, e, dateStr, count);
        });
        cell.addEventListener("mouseleave", () => {
          tooltip.style.opacity = "0";
        });

        grid.appendChild(cell);

        current.setDate(current.getDate() + 1);
        if (current.getDay() === 1) weekIndex++;
      }
      if (isSplitYearCalendar) {
        const trailingBlanks = (7 - ((end.getDay() + 6) % 7) - 1 + 7) % 7;
        for (let i = 0; i < trailingBlanks; i++) {
          const blank = document.createElement('div');
          blank.className = 'cell empty-cell';
          grid.appendChild(blank);
        }
      }

      // Draw month markers using measured cell positions, so they stay aligned
      // at browser zoom levels and across responsive cell sizes.
      function positionMonthDividers() {
        grid.querySelectorAll('.month-divider').forEach(line => line.remove());
        const gridRect = grid.getBoundingClientRect();
        const cells = Array.from(grid.children).filter(el => el.classList.contains('cell'));
        cells.forEach(cell => {
          if (!cell.classList.contains('month-start')) return;
          const rect = cell.getBoundingClientRect();
          const left = rect.left - gridRect.left;
          const right = rect.right - gridRect.left;
          const top = rect.top - gridRect.top;
          const bottom = rect.bottom - gridRect.top;
          const height = gridRect.height;
          if (top > 0.5) {
            const line = document.createElement('div');
            line.className = 'month-divider';
            line.style.left = (right + (window.matchMedia('(max-width: 600px)').matches ? 0.5 : 0.5)) + 'px';
            line.style.top = '0px';
            line.style.height = top + 'px';
            grid.appendChild(line);
          }
          if (bottom < height - 0.5) {
            const line = document.createElement('div');
            line.className = 'month-divider';
            line.style.left = (left - (window.matchMedia('(max-width: 600px)').matches ? 2 : 2.5)) + 'px';
            line.style.top = bottom + 'px';
            line.style.height = (height - bottom) + 'px';
            grid.appendChild(line);
          }
        });
      }
      requestAnimationFrame(positionMonthDividers);
      if (!window.monthDividerResizeHandler) {
        window.monthDividerResizeHandler = () => requestAnimationFrame(() => {
          document.querySelectorAll('.grid').forEach(activeGrid => {
          activeGrid.querySelectorAll('.month-divider').forEach(line => line.remove());
          const gridRect = activeGrid.getBoundingClientRect();
          const cells = Array.from(activeGrid.children).filter(el => el.classList.contains('cell'));
          cells.forEach(cell => {
            if (!cell.classList.contains('month-start')) return;
            const rect = cell.getBoundingClientRect();
            const left = rect.left - gridRect.left;
            const right = rect.right - gridRect.left;
            const top = rect.top - gridRect.top;
            const bottom = rect.bottom - gridRect.top;
            if (top > 0.5) {
              const line = document.createElement('div'); line.className = 'month-divider';
              line.style.left = (right + (window.matchMedia('(max-width: 600px)').matches ? 0.5 : 0.5)) + 'px'; line.style.top = '0px'; line.style.height = top + 'px';
              activeGrid.appendChild(line);
            }
            if (bottom < gridRect.height - 0.5) {
              const line = document.createElement('div'); line.className = 'month-divider';
              line.style.left = (left - (window.matchMedia('(max-width: 600px)').matches ? 2 : 2.5)) + 'px'; line.style.top = bottom + 'px'; line.style.height = (gridRect.height - bottom) + 'px';
              activeGrid.appendChild(line);
            }
          });
          });
        });
        window.addEventListener('resize', window.monthDividerResizeHandler);
      }

      // Month labels
      const cellWidth = 18;
      monthStarts.forEach(m => {
        const label = document.createElement("div");
        label.className = "month-label";
        label.textContent = m.label;
        label.style.left = (m.weekIndex * cellWidth) + "px";
        monthsRow.appendChild(label);
      });

      if (!targetArea) document.getElementById("totalMatches").textContent = total;
    }
  </script>
</body>
</html>
